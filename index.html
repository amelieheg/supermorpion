<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morpion — À vous de jouer</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #223b35; background: #f4f2e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); text-align: center; }
    .eyebrow { margin: 0 0 12px; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #62766a; }
    h1 { margin: 0; font-size: clamp(44px, 10vw, 62px); letter-spacing: -.06em; line-height: 1.1; }
    .intro { margin: 16px 0 26px; color: #627168; line-height: 1.6; }
    .players { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; }
    .player { border: 1px solid #d5dbcf; border-radius: 30px; padding: 8px 16px; color: #66756c; font-size: 14px; }
    .player.active { background: #234c3f; border-color: #234c3f; color: white; }
    .player b { margin-right: 7px; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; background: #e2e6db; border-radius: 24px; box-shadow: 0 18px 45px #263b3010; }
    .cell { position: relative; aspect-ratio: 1; min-width: 0; padding: 0; border: 0; border-radius: 14px; background: #fffef9; color: #234c3f; font: 650 clamp(40px, 12vw, 66px)/1 system-ui, sans-serif; cursor: pointer; transition: background .15s, transform .15s; }
    .cell:not(:disabled):hover { background: #eef4e8; transform: translateY(-2px); }
    .cell:disabled { cursor: default; opacity: 1; }
    .cell[data-symbol="O"] { color: #b65b40; }
    .cell.win { background: #cde4be; }
    .number { position: absolute; left: 12px; top: 10px; color: #728074; font: 400 11px/1 system-ui, sans-serif; }
    #status { margin: 25px 0 20px; min-height: 29px; font-size: 21px; font-weight: 650; }
    #reset { width: 100%; padding: 16px 20px; border: 0; border-radius: 14px; background: #234c3f; color: white; font: 600 16px system-ui, sans-serif; cursor: pointer; }
    #reset:hover { background: #173d30; }
    button:focus-visible { outline: 3px solid #b65b40; outline-offset: 4px; }
    .hint { font-size: 12px; color: #627168; margin: 20px 0 0; line-height: 1.6; }
    @media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Deux joueurs · Un écran</p>
    <h1>Le morpion.</h1>
    <p class="intro">Chacun son tour. Trois symboles alignés.<br>Et la victoire est à vous.</p>
    <div class="players" aria-label="Joueurs">
      <span id="player-x" class="player active"><b>X</b> Joueur 1</span>
      <span id="player-o" class="player"><b>O</b> Joueur 2</span>
    </div>
    <div class="board" role="group" aria-label="Grille de morpion, cases 1 à 9, de gauche à droite et de haut en bas">
      <button class="cell" type="button" aria-label="Case 1, vide"><span class="number" aria-hidden="true">1</span><span class="symbol" aria-hidden="true"></span></button>
      <button class="cell" type="button" aria-label="Case 2, vide"><span class="number" aria-hidden="true">2</span><span class="symbol" aria-hidden="true"></span></button>
      <button class="cell" type="button" aria-label="Case 3, vide"><span class="number" aria-hidden="true">3</span><span class="symbol" aria-hidden="true"></span></button>
      <button class="cell" type="button" aria-label="Case 4, vide"><span class="number" aria-hidden="true">4</span><span class="symbol" aria-hidden="true"></span></button>
      <button class="cell" type="button" aria-label="Case 5, vide"><span class="number" aria-hidden="true">5</span><span class="symbol" aria-hidden="true"></span></button>
      <button class="cell" type="button" aria-label="Case 6, vide"><span class="number" aria-hidden="true">6</span><span class="symbol" aria-hidden="true"></span></button>
      <button class="cell" type="button" aria-label="Case 7, vide"><span class="number" aria-hidden="true">7</span><span class="symbol" aria-hidden="true"></span></button>
      <button class="cell" type="button" aria-label="Case 8, vide"><span class="number" aria-hidden="true">8</span><span class="symbol" aria-hidden="true"></span></button>
      <button class="cell" type="button" aria-label="Case 9, vide"><span class="number" aria-hidden="true">9</span><span class="symbol" aria-hidden="true"></span></button>
    </div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">Au tour de X</p>
    <button id="reset" type="button">Nouvelle partie</button>
    <p class="hint">X commence · Alignez 3 symboles pour gagner<br>À la souris, au toucher ou au clavier (Tab puis Entrée).</p>
  </main>
  <script>
    'use strict';
    const cells = Array.from(document.querySelectorAll('.cell'));
    const status = document.getElementById('status');
    const playerX = document.getElementById('player-x');
    const playerO = document.getElementById('player-o');
    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];
    let board;
    let currentPlayer;
    let finished;

    function render() {
      cells.forEach((cell, index) => {
        cell.querySelector('.symbol').textContent = board[index];
        cell.dataset.symbol = board[index];
        cell.setAttribute('aria-label', 'Case ' + (index + 1) + ', ' + (board[index] || 'vide'));
        cell.disabled = finished || board[index] !== '';
      });
      playerX.classList.toggle('active', !finished && currentPlayer === 'X');
      playerO.classList.toggle('active', !finished && currentPlayer === 'O');
    }

    function play(index) {
      if (finished || board[index] !== '') return;
      board[index] = currentPlayer;
      const winningLine = winningLines.find(line => line.every(i => board[i] === currentPlayer));
      if (winningLine) {
        finished = true;
        status.textContent = currentPlayer + ' a gagné !';
        winningLine.forEach(i => cells[i].classList.add('win'));
      } else if (board.every(symbol => symbol !== '')) {
        finished = true;
        status.textContent = 'Match nul !';
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        status.textContent = 'Au tour de ' + currentPlayer;
      }
      render();
    }

    function newGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      finished = false;
      cells.forEach(cell => cell.classList.remove('win'));
      status.textContent = 'Au tour de X';
      render();
    }

    cells.forEach((cell, index) => cell.addEventListener('click', () => play(index)));
    document.getElementById('reset').addEventListener('click', newGame);
    newGame();
  </script>
</body>
</html>
